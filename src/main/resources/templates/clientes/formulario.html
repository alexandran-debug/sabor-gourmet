<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de clientes | Sabor Gourmet</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
  </head>

  <body class="pagina-clientes formulario-cliente">
    <nav class="navegacion-interior">
      <a class="marca-interior" th:href="@{/}">SABOR GOURMET</a>
      <a th:href="@{/clientes}">Volver a clientes</a>
    </nav>

    <main class="formulario-cliente-contenido">
      <header class="formulario-cliente-portada">
        <p class="clientes-etiqueta">SABOR GOURMET · ADMINISTRACIÓN</p>

        <h1
          th:text="${cliente.id == null ? 'Registrar cliente' : 'Editar cliente'}"
        >
          Registrar cliente
        </h1>

        <p>
          Mantén actualizada la información de nuestros clientes para gestionar
          sus reservas.
        </p>
      </header>

      <section class="formulario-cliente-panel">
        <div class="formulario-cliente-titulo">
          <span>✦</span>
          <div>
            <h2>Información del cliente</h2>
            <p>Completa todos los campos solicitados</p>
          </div>
        </div>

        <p class="mensaje-error" th:if="${error}" th:text="${error}"></p>

        <form
          class="formulario-cliente-campos"
          th:object="${cliente}"
          th:action="${cliente.id == null} ? @{/clientes/guardar} : @{/clientes/actualizar/{id}(id=${cliente.id})}"
          method="post"
        >
          <div class="campo-cliente">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              th:field="*{nombre}"
              maxlength="60"
              placeholder="Ingresa el nombre"
              required
            />
            <p class="error-campo" th:errors="*{nombre}"></p>
          </div>

          <div class="campo-cliente">
            <label for="apellido">Apellido</label>
            <input
              type="text"
              id="apellido"
              th:field="*{apellido}"
              maxlength="60"
              placeholder="Ingresa el apellido"
              required
            />
            <p class="error-campo" th:errors="*{apellido}"></p>
          </div>

          <div class="campo-cliente">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              th:field="*{correo}"
              maxlength="120"
              placeholder="ejemplo@correo.com"
              required
            />
            <p class="error-campo" th:errors="*{correo}"></p>
          </div>

          <div class="campo-cliente">
            <label for="telefono">Teléfono</label>
            <input
              type="text"
              id="telefono"
              th:field="*{telefono}"
              maxlength="20"
              placeholder="Ingresa el teléfono"
              required
            />
            <p class="error-campo" th:errors="*{telefono}"></p>
          </div>

          <div class="formulario-cliente-acciones">
            <a class="cliente-boton-volver" th:href="@{/clientes}">
              Cancelar
            </a>

            <button class="cliente-boton-guardar" type="submit">
              Guardar cliente
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="pie-inicio">SABOR GOURMET · SISTEMA DE RESERVAS</footer>
  </body>
</html>
